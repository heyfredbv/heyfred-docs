name: Sync Updates from Upstream

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "update" to confirm you want to sync latest docs from upstream'
        required: true
        type: string
      upstream_repo:
        description: 'Upstream template repository (e.g., "org/docs-template")'
        required: true
        type: string
        default: "Autocalls/documentation"

concurrency:
  group: sync-updates-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'update' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Verify brand.config.json exists
      - name: Check for branding config
        id: check_config
        run: |
          if [ ! -f "brand.config.json" ]; then
            echo "ERROR: brand.config.json not found. Please run the 'Rebrand Documentation' workflow first."
            exit 1
          fi
          echo "config_exists=true" >> $GITHUB_OUTPUT

      # Save partner's branding config and assets before updating
      - name: Backup branding config and assets
        run: |
          mkdir -p /tmp/backup
          cp brand.config.json /tmp/backup/

          # Backup ALL resources (custom screenshots, logos, images)
          if [ -d "resources" ]; then
            cp -r resources /tmp/backup/
          fi

          # Backup favicon if it exists
          if [ -f "favicon.png" ]; then
            cp favicon.png /tmp/backup/
          fi

          # Backup any files/dirs listed in .syncpreserve (custom content pages)
          if [ -f ".syncpreserve" ]; then
            echo "Found .syncpreserve - backing up custom content files..."
            while IFS= read -r line || [[ -n "$line" ]]; do
              # Skip empty lines and comments
              [[ -z "$line" || "$line" =~ ^# ]] && continue
              line="${line%$'\r'}"  # strip Windows line endings
              if [ -f "$line" ]; then
                mkdir -p "/tmp/backup/$(dirname "$line")"
                cp "$line" "/tmp/backup/$line"
                echo "  Backed up: $line"
              elif [ -d "$line" ]; then
                mkdir -p "/tmp/backup/$line"
                cp -r "$line/." "/tmp/backup/$line/"
                echo "  Backed up dir: $line"
              else
                echo "  Warning: $line not found, skipping"
              fi
            done < ".syncpreserve"
          fi

      # Fetch latest from upstream template repo
      - name: Fetch upstream changes
        run: |
          git remote add upstream https://github.com/${{ inputs.upstream_repo }}.git || true
          git fetch upstream main

          # Get list of files from upstream, excluding workflow files and config
          git checkout upstream/main -- $(git ls-tree -r --name-only upstream/main | grep -v -E '^\.github/|^brand\.config\.json$')

      # Restore partner's branding config and assets
      - name: Restore branding config and assets
        run: |
          cp /tmp/backup/brand.config.json brand.config.json

          # Restore custom resources by OVERLAYING the backup on top of the
          # upstream files. This keeps NEW upstream images (screenshots for new
          # pages) while letting the partner's custom images override upstream
          # ones. NOTE: overlay (not full replace) means images the partner
          # deliberately deleted may return from upstream - remove them again
          # via a follow-up commit or add them to .syncpreserve handling.
          if [ -d "/tmp/backup/resources" ]; then
            mkdir -p resources
            cp -r /tmp/backup/resources/. resources/
          fi

          # Restore favicon
          if [ -f "/tmp/backup/favicon.png" ]; then
            cp /tmp/backup/favicon.png favicon.png
          fi

          # Restore files/dirs from .syncpreserve (custom content pages)
          if [ -f ".syncpreserve" ]; then
            echo "Restoring custom content files from .syncpreserve..."
            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ -z "$line" || "$line" =~ ^# ]] && continue
              line="${line%$'\r'}"
              if [ -f "/tmp/backup/$line" ]; then
                mkdir -p "$(dirname "$line")"
                cp "/tmp/backup/$line" "$line"
                echo "  Restored: $line"
              elif [ -d "/tmp/backup/$line" ]; then
                mkdir -p "$line"
                cp -r "/tmp/backup/$line/." "$line/"
                echo "  Restored dir: $line"
              fi
            done < ".syncpreserve"
          fi

      # Re-apply branding + full white-label in a single robust step.
      #
      # Why a shell step instead of gha-find-replace: the previous
      # "**/*.{json,mdx}" include glob did NOT match root-level files, so every
      # replacement targeting mint.json (colors, URLs, LinkedIn, API baseUrl,
      # navigation) was silently skipped while each step still reported success.
      # find + sed reliably covers both root and nested files.
      #
      # White-label rules:
      #  - Brand PROSE ("Autocalls", capital) -> brand name, in .mdx and .json
      #    (lowercase technical tokens like enum "autocalls" values and image
      #    filenames stay untouched because the match is case-sensitive).
      #  - All autocalls.ai hosts (app/api/automate) -> dashboard host; the API
      #    base for HeyFred is the dashboard URL (e.g. https://app.heyfred.nl/api).
      #  - recordings.autocalls.ai -> recordings.<website-domain>.
      #  - contact@autocalls.ai -> contact@<website-domain>.
      - name: Re-apply branding and white-label
        run: |
          set -euo pipefail

          NAME=$(jq -r '.name' brand.config.json)
          PRIMARY=$(jq -r '.primaryColor' brand.config.json)
          WEBSITE=$(jq -r '.websiteUrl' brand.config.json)
          DASHBOARD=$(jq -r '.dashboardUrl' brand.config.json)
          SUPPORT=$(jq -r '.supportUrl' brand.config.json)
          LINKEDIN=$(jq -r '.linkedinUrl // empty' brand.config.json)
          OGIMAGE=$(jq -r '.ogImageUrl // empty' brand.config.json)

          # Derive bare host (e.g. heyfred.nl) for technical white-labeling
          WEB_HOST=$(printf '%s' "$WEBSITE" | sed -E 's#^https?://##; s#/.*$##')
          REC_URL="https://recordings.${WEB_HOST}"
          EMAIL="contact@${WEB_HOST}"

          # Helpers: apply a sed program to the right file set (root + nested,
          # never .git/.github/brand.config.json). -r skips empty file lists.
          all() { find . -type f \( -name '*.mdx' -o -name '*.json' \) \
                    -not -path './.git/*' -not -path './.github/*' \
                    -not -name 'brand.config.json' -print0 | xargs -0 -r sed -i "$@"; }

          # --- Technical hostnames / URLs (most specific first) ---
          all "s#https://app\.autocalls\.ai#${DASHBOARD}#g"
          all "s#https://api\.autocalls\.ai#${DASHBOARD}#g"
          all "s#https://automate\.autocalls\.ai#${DASHBOARD}#g"
          all "s#https://recordings\.autocalls\.ai#${REC_URL}#g"
          all "s#https://autocalls\.ai/contact#${SUPPORT}#g"
          all "s#https://autocalls\.ai#${WEBSITE}#g"
          all "s#[A-Za-z0-9._%+-]\+@autocalls\.ai#${EMAIL}#g"
          # Any remaining bare "autocalls.ai" as visible link text (e.g.
          # "[app.autocalls.ai](...)", "autocalls.ai/privacy-policy") -> host.
          all "s#autocalls\.ai#${WEB_HOST}#g"

          # --- OG image (optional) ---
          if [ -n "$OGIMAGE" ]; then
            all "s#https://autocalls\.ai/ogimage-en\.jpg#${OGIMAGE}#g"
          fi

          # --- LinkedIn ---
          if [ -n "$LINKEDIN" ]; then
            all "s#https://www\.linkedin\.com/company/autocalls-ai#${LINKEDIN}#g"
          else
            sed -i '/"linkedin":/d' mint.json || true
          fi

          # --- Brand name (prose). Do the ".ai" form first so we don't leave
          #     a dangling ".ai" behind. Case-sensitive: leaves lowercase
          #     technical tokens (enum values, filenames) intact. ---
          all "s#Autocalls\.ai#${NAME}#g"
          all "s#Autocalls#${NAME}#g"

          # --- Colors (upstream greens -> primary). '|' delimiter because the
          #     hex codes contain '#'. Case-insensitive for safety. ---
          all "s|#06df4b|${PRIMARY}|Ig"
          all "s|#65fe50|${PRIMARY}|Ig"
          all "s|#01df4a|${PRIMARY}|Ig"

          # --- Navigation references to renamed custom pages ---
          all "s#introduction/what-is-autocalls#introduction/what-is-heyfred#g"
          all "s#introduction/what-is-platform#introduction/what-is-heyfred#g"
          all "s#automation-platform/calls-related/autocalls-tool#automation-platform/calls-related/heyfred-tool#g"
          all "s#automation-platform/calls-related/platform-tool#automation-platform/calls-related/heyfred-tool#g"

          # --- Remove upstream pages replaced by custom HeyFred pages ---
          rm -f introduction/what-is-autocalls.mdx introduction/what-is-platform.mdx
          rm -f automation-platform/calls-related/autocalls-tool.mdx automation-platform/calls-related/platform-tool.mdx

          echo "Branding + white-label applied."

      # Commit synced and rebranded docs
      - name: Commit synced docs (open PR)
        env:
          # Prefer a PAT so the PR triggers downstream CI; fall back to the
          # built-in token so a PR is still opened if PR_PAT is missing/expired.
          GH_TOKEN: ${{ secrets.PR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          BRANCH="sync-docs/$(date +%Y-%m-%d)-${GITHUB_RUN_ID}"

          # Start a new branch BEFORE committing
          git checkout -b "$BRANCH"

          git add -A -- ':!.github/workflows/'

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Sync docs from upstream - $(date +%Y-%m-%d)"
          git push -u origin "$BRANCH"

          # Give GitHub's API time to register the new branch
          sleep 10

          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "Sync docs from upstream ($(date +%Y-%m-%d))" \
            --body "Automated sync from ${{ inputs.upstream_repo }}. Excludes .github/workflows and preserves brand.config.json + branding assets." \
            2>&1) && echo "PR created: $PR_URL" \
          || echo "PR creation failed - open it manually at: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
