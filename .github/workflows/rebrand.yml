name: Rebrand Documentation

on:
  workflow_dispatch:
    inputs:
      brand_name:
        description: 'Your brand name (e.g., "MyCompany")'
        required: true
        type: string
      primary_color:
        description: 'Primary color hex (e.g., "#3B82F6")'
        required: true
        type: string
        default: "#3B82F6"
      website_url:
        description: 'Your website URL (e.g., "https://mycompany.com")'
        required: true
        type: string
      dashboard_url:
        description: 'Your dashboard URL (e.g., "https://app.mycompany.com") - API URL will be derived as dashboard_url/api/'
        required: true
        type: string
      support_url:
        description: 'Your support page URL (e.g., "https://mycompany.com/contact")'
        required: true
        type: string
      linkedin_url:
        description: 'Your LinkedIn company URL (optional, leave empty to remove)'
        required: false
        type: string
      og_image_url:
        description: 'Your OG image URL for social sharing (optional)'
        required: false
        type: string

permissions:
  contents: write


jobs:
  rebrand:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Re-apply branding + full white-label in a single robust step.
      #
      # Why a shell step instead of gha-find-replace: the previous
      # "**/*.{json,mdx}" include glob did NOT match root-level files, so every
      # replacement targeting mint.json (colors, URLs, LinkedIn, API baseUrl,
      # navigation) was silently skipped while each step still reported success.
      # find + sed reliably covers both root and nested files.
      - name: Apply branding and white-label
        env:
          NAME: ${{ inputs.brand_name }}
          PRIMARY: ${{ inputs.primary_color }}
          WEBSITE: ${{ inputs.website_url }}
          DASHBOARD: ${{ inputs.dashboard_url }}
          SUPPORT: ${{ inputs.support_url }}
          LINKEDIN: ${{ inputs.linkedin_url }}
          OGIMAGE: ${{ inputs.og_image_url }}
        run: |
          set -euo pipefail

          # Derive bare host (e.g. mycompany.com) for technical white-labeling
          WEB_HOST=$(printf '%s' "$WEBSITE" | sed -E 's#^https?://##; s#/.*$##')
          REC_URL="https://recordings.${WEB_HOST}"
          EMAIL="contact@${WEB_HOST}"

          # Helper: apply a sed program to the right file set (root + nested,
          # never .git/.github/brand.config.json). -r skips empty file lists.
          all() { find . -type f \( -name '*.mdx' -o -name '*.json' \) \
                    -not -path './.git/*' -not -path './.github/*' \
                    -not -name 'brand.config.json' -print0 | xargs -0 -r sed -i "$@"; }

          # --- Technical hostnames / URLs (most specific first) ---
          all "s#https://app\.autocalls\.ai#${DASHBOARD}#g"
          all "s#https://api\.autocalls\.ai#${DASHBOARD}#g"
          all "s#https://automate\.autocalls\.ai#${DASHBOARD}#g"
          all "s#https://recordings\.autocalls\.ai#${REC_URL}#g"
          all "s#https://autocalls\.ai/contact#${SUPPORT}#g"
          all "s#https://autocalls\.ai#${WEBSITE}#g"
          all "s#[A-Za-z0-9._%+-]\+@autocalls\.ai#${EMAIL}#g"
          # Any remaining bare "autocalls.ai" as visible link text -> host.
          all "s#autocalls\.ai#${WEB_HOST}#g"

          # --- OG image (optional) ---
          if [ -n "$OGIMAGE" ]; then
            all "s#https://autocalls\.ai/ogimage-en\.jpg#${OGIMAGE}#g"
          fi

          # --- LinkedIn ---
          if [ -n "$LINKEDIN" ]; then
            all "s#https://www\.linkedin\.com/company/autocalls-ai#${LINKEDIN}#g"
          else
            sed -i '/"linkedin":/d' mint.json || true
          fi

          # --- Brand name (prose). Do the ".ai" form first so we don't leave a
          #     dangling ".ai". Case-sensitive: leaves lowercase technical tokens
          #     (enum values, image filenames) intact. ---
          all "s#Autocalls\.ai#${NAME}#g"
          all "s#Autocalls#${NAME}#g"

          # --- Colors (template greens -> primary). '|' delimiter because the
          #     hex codes contain '#'. Case-insensitive for safety. ---
          all "s|#06df4b|${PRIMARY}|Ig"
          all "s|#65fe50|${PRIMARY}|Ig"
          all "s|#01df4a|${PRIMARY}|Ig"

          # --- Rename pages with 'autocalls' in the filename, update nav ---
          if [ -f "introduction/what-is-autocalls.mdx" ]; then
            mv introduction/what-is-autocalls.mdx introduction/what-is-platform.mdx
          fi
          all "s#introduction/what-is-autocalls#introduction/what-is-platform#g"

          if [ -f "automation-platform/calls-related/autocalls-tool.mdx" ]; then
            mv automation-platform/calls-related/autocalls-tool.mdx automation-platform/calls-related/platform-tool.mdx
          fi
          all "s#automation-platform/calls-related/autocalls-tool#automation-platform/calls-related/platform-tool#g"

          echo "Branding + white-label applied."

      # Save branding config for future updates
      - name: Save branding config
        run: |
          cat > brand.config.json << 'EOF'
          {
            "name": "${{ inputs.brand_name }}",
            "primaryColor": "${{ inputs.primary_color }}",
            "websiteUrl": "${{ inputs.website_url }}",
            "dashboardUrl": "${{ inputs.dashboard_url }}",
            "supportUrl": "${{ inputs.support_url }}",
            "linkedinUrl": "${{ inputs.linkedin_url }}",
            "ogImageUrl": "${{ inputs.og_image_url }}"
          }
          EOF

      # Commit all changes
      - name: Commit rebranded docs
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add -A -- ':!.github/workflows/'
          git commit -m "Rebrand documentation to ${{ inputs.brand_name }}" || echo "Nothing to commit"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
